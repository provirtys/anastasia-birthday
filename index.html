<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>С Днём Рождения, Настя!</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,600;1,300&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f1623;
      font-family: 'Nunito', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 28px;
      text-align: center;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .wrap {
      position: relative;
      z-index: 5;
      max-width: 360px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hello {
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 16px;
      opacity: 0;
      animation: up 0.7s 0.2s forwards;
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(3rem, 17vw, 5.5rem);
      font-weight: 400;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 8px;
      opacity: 0;
      animation: up 0.8s 0.4s forwards;
    }

    .tag {
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      margin-bottom: 44px;
      opacity: 0;
      animation: up 0.7s 0.6s forwards;
    }

    .quote {
      font-size: clamp(1.05rem, 5vw, 1.25rem);
      font-weight: 300;
      line-height: 1.85;
      color: rgba(255,255,255,0.8);
      margin-bottom: 52px;
      opacity: 0;
      animation: up 0.8s 0.8s forwards;
    }

    .btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 50px;
      padding: 14px 36px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      opacity: 0;
      animation: up 0.7s 1.1s forwards;
    }
    .btn:active {
      transform: scale(0.95);
      border-color: rgba(255,255,255,0.5);
      color: #fff;
    }

    .hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
      z-index: 6;
      white-space: nowrap;
      opacity: 0;
      animation: pulse 3s ease-in-out infinite 2.5s;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; }
      50%       { opacity: 0.45; }
    }

    .burst-el {
      position: fixed;
      font-size: 1.5rem;
      pointer-events: none;
      z-index: 21;
      animation: burst var(--d) ease-out forwards;
    }
    @keyframes burst {
      0%   { opacity: 1; transform: translate(0,0); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)); }
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<div class="wrap">
  <p class="hello">С Днём Рождения</p>
  <h1 class="name">Анастасия</h1>
  <p class="tag">бухгалтер от бога</p>
  <p class="quote">Живи в своё удовольствие,<br>смейся без причины,<br>люби от всей души</p>
  <button class="btn" id="btn">🎆 Запустить салют</button>
</div>

<p class="hint">Тапни по экрану</p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const pts = [];
const colors = ['#fff','#ffd6e0','#c8f7c5','#a8d8f0','#ffeaa7','#fd79a8','#74b9ff','#ffecd2'];

function boom(x, y) {
  const n = 80 + (Math.random() * 50 | 0);
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 / n) * i;
    const s = 1.5 + Math.random() * 4;
    pts.push({ x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      a: 1, r: Math.random() * 2 + 0.8,
      c: colors[Math.random() * colors.length | 0],
      decay: 0.011 + Math.random() * 0.009,
      g: 0.05 + Math.random() * 0.04
    });
  }
}

function multiBoom() {
  const cx = W / 2, cy = H * 0.3;
  [[0,0],[W*.22,-H*.04],[-W*.22,-H*.04]].forEach(([ox, oy], i) => {
    setTimeout(() => boom(cx + ox, cy + oy), i * 200);
  });
}

(function loop() {
  ctx.clearRect(0, 0, W, H);
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += p.g; p.vx *= 0.99;
    p.a -= p.decay;
    ctx.globalAlpha = Math.max(0, p.a);
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    if (p.a <= 0) pts.splice(i, 1);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
})();

setTimeout(multiBoom, 1200);

document.getElementById('btn').addEventListener('click', multiBoom);

const em = ['🎉','🎊','✨','🌸','💫','🥂','🌟','💛','🎈'];
function popEmojis(x, y) {
  for (let i = 0; i < 6; i++) {
    const el = document.createElement('div');
    el.className = 'burst-el';
    el.textContent = em[Math.random() * em.length | 0];
    const a = Math.random() * Math.PI * 2;
    const d = 50 + Math.random() * 70;
    const dur = (0.6 + Math.random() * 0.4).toFixed(2);
    el.style.cssText = `left:${x}px;top:${y}px;--tx:${(Math.cos(a)*d)|0}px;--ty:${(Math.sin(a)*d)|0}px;--d:${dur}s`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
}

document.addEventListener('touchstart', e => {
  if (e.target.closest('#btn')) return;
  const t = e.touches[0];
  boom(t.clientX, t.clientY * 0.7);
  popEmojis(t.clientX, t.clientY);
}, { passive: true });

document.addEventListener('click', e => {
  if (e.target.closest('#btn')) return;
  boom(e.clientX, e.clientY * 0.7);
  popEmojis(e.clientX, e.clientY);
});
</script>
</body>
</html>
